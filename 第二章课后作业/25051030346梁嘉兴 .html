<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>如何培养认真严谨的习惯</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .header-title {
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .header-title .blue {
            color: #0066cc;
        }
        .header-title .gray {
            color: #666666;
        }
        .meta-info {
            text-align: center;
            color: #666;
            font-size: 22px;
            margin-bottom: 30px;
        }
        .container {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        .banner {
            flex: 1;
            min-width: 400px;
        }
        .banner img {
            width: 100%;
            display: block;
        }
        .content-list {
            flex: 2;
            font-size: 24px;
            line-height: 1.8;
        }
        .content-list li {
            list-style: none;
            margin: 15px 0;
            position: relative;
            padding-left: 30px;
        }
        .content-list li::before {
            content: "♠";
            position: absolute;
            left: 0;
            color: #000;
        }
        .red-text {
            color: #d92b2b;
        }
    </style>
</head>
<body>
    <h1 class="header-title">
        <span class="gray">如何培养</span>
        <span class="blue">认真严谨</span>
        <span class="gray">的习惯</span>
    </h1>
    <div class="meta-info">
        时间:2022年02月21日17时26分 &nbsp;&nbsp; 来源:思政教育
    </div>
    <div class="container">
        <div class="banner">
            <!-- 你可以把下面的 src 换成你自己的图片地址 -->
            <img src="1.jpg" alt="态度决定一切 细节决定成败">
        </div>
        <ul class="content-list">
            <li><span class="red-text">反复确认，</span>做任何事情都要照顾到每一个细节并反复确认，<span class="red-text">要有一种能在脑子里‘虚拟’整个事件过程的能力，</span>确保所有的节点都正常。</li>
            <li><span class="red-text">想尽办法努力让不可能变为可能</span>只有佣金全力做了，才算是努力</li>
            <li><span class="red-text">结果导向一切以结果为导向，</span>任何事情都是你的名片。还要思考你的结果和过程是否满足所有和你配合的人的需求,</li>
            <li><span class="red-text">学会假设了解周围比你强的人，</span>观察他们的做事方法。遇到让自己束手无策的时候，把自己虚拟成他的样子，想想他会怎么做</li>
        </ul>
    </div>
</body>
</html>
